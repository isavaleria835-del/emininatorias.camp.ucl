<!DOCTYPE html>

<title>Champions League 2026</title>


<style>


/* =========================================================
   CONFIGURAÇÕES GERAIS
========================================================= */


* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


:root {

    --azul-escuro:
        #030a2c;

    --texto:
        #ffffff;

    --texto-secundario:
        #c6caff;

    --borda:
        rgba(
            114,
            137,
            255,
            0.45
        );

}


html {

    min-height:
        100%;

}


body {

    min-height:
        100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:
        var(--texto);

    background:
        var(--azul-escuro);

    overflow-x:
        hidden;

}



/* =========================================================
   FUNDO DO SITE

   A IMAGEM FICA NÍTIDA.
   NÃO TEM MAIS DESFOQUE.
========================================================= */


.background-layer {

    position:
        fixed;

    inset:
        0;

    z-index:
        -3;

    background-position:
        center top;

    background-repeat:
        no-repeat;

    background-size:
        cover;

    filter:
        brightness(0.88)
        saturate(1.05);

}



/* =========================================================
   CAMADA LEVE EM CIMA DO FUNDO

   Serve só para as caixas aparecerem melhor.
========================================================= */


.background-overlay {

    position:
        fixed;

    inset:
        0;

    z-index:
        -2;

    pointer-events:
        none;

    background:

        linear-gradient(

            180deg,

            rgba(
                1,
                5,
                30,
                0.03
            ),

            rgba(
                2,
                7,
                38,
                0.08
            ),

            rgba(
                2,
                6,
                27,
                0.18
            )

        );

}



/* =========================================================
   ESPAÇO SUPERIOR

   A logo UEFA Champions League já estará
   dentro da própria imagem de fundo.
========================================================= */


.espaco-topo {

    width:
        100%;

    height:
        190px;

}



/* =========================================================
   ÁREA DA CHAVE
========================================================= */


.bracket-scroll {

    width:
        100%;

    overflow-x:
        auto;

    overflow-y:
        hidden;

    padding:
        5px 16px 50px;

    scrollbar-color:

        rgba(
            100,
            116,
            255,
            0.55
        )

        rgba(
            255,
            255,
            255,
            0.04
        );

}


.bracket-scroll::-webkit-scrollbar {

    height:
        8px;

}


.bracket-scroll::-webkit-scrollbar-track {

    background:
        rgba(
            255,
            255,
            255,
            0.04
        );

}


.bracket-scroll::-webkit-scrollbar-thumb {

    background:
        rgba(
            100,
            116,
            255,
            0.55
        );

    border-radius:
        999px;

}



/* =========================================================
   CHAVE COMPLETA
========================================================= */


.bracket {

    width:
        max-content;

    min-width:
        1315px;

    min-height:
        680px;

    margin:
        auto;

    display:
        grid;

    grid-template-columns:

        145px
        44px

        145px
        44px

        145px

        180px

        145px

        44px
        145px

        44px
        145px;

    column-gap:
        9px;

    align-items:
        stretch;

}



/* =========================================================
   ETAPAS
========================================================= */


.stage {

    min-height:
        680px;

    position:
        relative;

    display:
        flex;

    flex-direction:
        column;

}



/* =========================================================
   TÍTULOS DAS ETAPAS
========================================================= */


.stage-title {

    position:
        absolute;

    z-index:
        5;

    width:
        100%;

    text-align:
        center;

    color:
        white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        15px;

    font-weight:
        700;

    letter-spacing:
        0;

    text-shadow:

        0 3px 10px

        rgba(
            0,
            0,
            0,
            0.65
        );

}



/* QUARTAS */


.quartas
.stage-title {

    top:
        4px;

}



/* SEMIFINAIS */


.semifinais
.stage-title {

    top:
        105px;

}



/* FINAL */


.final-stage
.stage-title {

    top:
        257px;

}



/* CAMPEÃO */


.champion-stage
.stage-title {

    top:
        247px;

}



/* =========================================================
   CORPO DAS ETAPAS
========================================================= */


.stage-body {

    flex:
        1;

    min-height:
        680px;

    padding:
        8px 0 25px;

    display:
        flex;

    flex-direction:
        column;

}


.quartas
.stage-body {

    justify-content:
        space-around;

}


.semifinais
.stage-body {

    justify-content:
        space-around;

}


.final-stage
.stage-body {

    justify-content:
        center;

}


.champion-stage
.stage-body {

    justify-content:
        center;

}



/* =========================================================
   CAIXAS DOS JOGADORES
========================================================= */


.player-card {

    width:
        100%;

    min-height:
        68px;

    padding:
        9px 10px;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    border-radius:
        14px;

    background:

        linear-gradient(

            135deg,

            rgba(
                25,
                39,
                105,
                0.72
            ),

            rgba(
                22,
                17,
                84,
                0.62
            )

        );

    border:
        1px solid
        var(--borda);

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    box-shadow:

        0 9px 30px

        rgba(
            0,
            0,
            0,
            0.22
        ),

        inset

        0 0 15px

        rgba(
            110,
            119,
            255,
            0.05
        );

}



/* =========================================================
   ESCUDO / LOGO
========================================================= */


.player-logo {

    width:
        44px;

    height:
        44px;

    flex:
        0 0 44px;

    border-radius:
        50%;

    object-fit:
        cover;

    background:
        rgba(
            255,
            255,
            255,
            0.08
        );

    border:
        1px solid
        rgba(
            255,
            255,
            255,
            0.24
        );

    box-shadow:

        0 4px 14px

        rgba(
            0,
            0,
            0,
            0.25
        );

}



/* =========================================================
   NOME DO JOGADOR
========================================================= */


.player-name {

    flex:
        1;

    min-width:
        0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        14px;

    font-weight:
        700;

    line-height:
        1.15;

    overflow-wrap:
        anywhere;

}



/* =========================================================
   CAMPEÃO
========================================================= */


.champion-stage {

    position:
        relative;

}


.champion-card {

    min-height:
        84px;

    background:

        linear-gradient(

            135deg,

            rgba(
                68,
                54,
                174,
                0.80
            ),

            rgba(
                27,
                48,
                126,
                0.78
            )

        );

    border:

        1px solid

        rgba(
            164,
            169,
            255,
            0.65
        );

    box-shadow:

        0 0 35px

        rgba(
            104,
            78,
            255,
            0.20
        ),

        0 12px 35px

        rgba(
            0,
            0,
            0,
            0.3
        );

}


.champion-card
.player-logo {

    width:
        52px;

    height:
        52px;

    flex-basis:
        52px;

}


.champion-card
.player-name {

    font-size:
        16px;

}



/* =========================================================
   CONECTORES
========================================================= */


.connector-column {

    min-height:
        680px;

    padding:
        0 0 25px;

    display:
        flex;

    flex-direction:
        column;

}


.connector-pair {

    position:
        relative;

    flex:
        1;

}


.connector-pair
.line-top,

.connector-pair
.line-bottom,

.connector-pair
.line-middle,

.connector-pair
.line-vertical {

    position:
        absolute;

    display:
        block;

    background:

        rgba(
            194,
            205,
            255,
            0.70
        );

}



/* =========================================================
   CONECTORES ESQUERDA
========================================================= */


.connector-left
.line-top {

    left:
        0;

    top:
        25%;

    width:
        75%;

    height:
        2px;

}


.connector-left
.line-bottom {

    left:
        0;

    top:
        75%;

    width:
        75%;

    height:
        2px;

}


.connector-left
.line-vertical {

    left:
        75%;

    top:
        25%;

    width:
        2px;

    height:
        50%;

}


.connector-left
.line-middle {

    left:
        75%;

    top:
        50%;

    width:
        25%;

    height:
        2px;

}



/* =========================================================
   CONECTORES DIREITA
========================================================= */


.connector-right
.line-top {

    right:
        0;

    top:
        25%;

    width:
        75%;

    height:
        2px;

}


.connector-right
.line-bottom {

    right:
        0;

    top:
        75%;

    width:
        75%;

    height:
        2px;

}


.connector-right
.line-vertical {

    right:
        75%;

    top:
        25%;

    width:
        2px;

    height:
        50%;

}


.connector-right
.line-middle {

    right:
        75%;

    top:
        50%;

    width:
        25%;

    height:
        2px;

}



/* =========================================================
   LINHAS AO LADO DO CAMPEÃO
========================================================= */


.champion-stage::before,

.champion-stage::after {

    content:
        "";

    position:
        absolute;

    top:
        50%;

    width:
        10px;

    height:
        2px;

    background:

        rgba(
            194,
            205,
            255,
            0.70
        );

}


.champion-stage::before {

    left:
        -10px;

}


.champion-stage::after {

    right:
        -10px;

}



/* =========================================================
   DICA PARA CELULAR
========================================================= */


.mobile-tip {

    display:
        none;

    padding:
        0 20px 15px;

    text-align:
        center;

    color:
        #b8c0ff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size:
        12px;

}



/* =========================================================
   RESPONSIVIDADE PARA CELULAR
========================================================= */

@media
(max-width: 800px) {


    /* ESPAÇO DA LOGO NO FUNDO */

    .espaco-topo {

        height: 120px;

    }


    /* CHAVE COMPLETA */

    .bracket {

        min-width: 920px;

        min-height: 520px;

        grid-template-columns:

            105px
            28px

            105px
            28px

            105px

            125px

            105px

            28px
            105px

            28px
            105px;

        column-gap: 5px;

    }


    /* ALTURA DAS ETAPAS */

    .stage {

        min-height: 520px;

    }


    .stage-body {

        min-height: 520px;

        padding:
            8px 0 18px;

    }


    /* CONECTORES */

    .connector-column {

        min-height: 520px;

        padding:
            0 0 18px;

    }


    /* CAIXINHAS */

    .player-card {

        min-height: 52px;

        padding:
            6px 7px;

        gap: 6px;

        border-radius: 10px;

    }


    /* ESCUDOS */

    .player-logo {

        width: 32px;

        height: 32px;

        flex-basis: 32px;

    }


    /* NOMES */

    .player-name {

        font-size: 11.5px;

        line-height: 1.1;

    }


    /* CAIXA DO CAMPEÃO */

    .champion-card {

        min-height: 62px;

    }


    .champion-card
    .player-logo {

        width: 38px;

        height: 38px;

        flex-basis: 38px;

    }


    .champion-card
    .player-name {

        font-size: 12px;

    }


    /* TÍTULOS */

    .stage-title {

        font-size: 11px;

        line-height: 1.1;

    }


    /* QUARTAS */

    .quartas
    .stage-title {

        top: 8px;

    }


    /* SEMIFINAIS */

    .semifinais
    .stage-title {

        top: 77px;

    }


    /* FINAL */

    .final-stage
    .stage-title {

        top: 200px;

    }


    /* CAMPEÃO */

    .champion-stage
    .stage-title {

        top: 190px;

    }


    /* AVISO DE DESLIZAR */

    .mobile-tip {

        display: block;

        padding:
            0 15px 10px;

        font-size: 11px;

    }


    /* MENOS ESPAÇO NAS LATERAIS */

    .bracket-scroll {

        padding:
            4px 6px 30px;

    }

}



/* =========================================================
   CELULARES PEQUENOS
========================================================= */

@media
(max-width: 480px) {


    .espaco-topo {

        height: 105px;

    }


    .bracket {

        min-width: 835px;

        grid-template-columns:

            95px
            25px

            95px
            25px

            95px

            110px

            95px

            25px
            95px

            25px
            95px;

        column-gap: 4px;

    }


    .player-card {

        padding:
            5px 6px;

    }


    .player-logo {

        width: 29px;

        height: 29px;

        flex-basis: 29px;

    }


    .player-name {

        font-size: 10.5px;

    }


    .stage-title {

        font-size: 10px;

    }


    .champion-card
    .player-logo {

        width: 35px;

        height: 35px;

        flex-basis: 35px;

    }


    .champion-card
    .player-name {

        font-size: 11px;

    }

}

/* =========================================================
   ADICIONAR VERSÃO ÀS IMAGENS
========================================================= */


function urlComVersao(url) {


    if (!url) {

        return "";

    }


    if (

        url.startsWith(
            "data:"
        )

        ||

        url.startsWith(
            "blob:"
        )

    ) {

        return url;

    }


    const separador =

        url.includes("?")

        ?

        "&"

        :

        "?";


    return (

        url

        +

        separador

        +

        "site_version="

        +

        encodeURIComponent(
            SITE_VERSION
        )

    );


}



/* =========================================================
   CARREGAR FUNDO
========================================================= */


function carregarVisual() {


    const fundo =

        VISUAL
            .fundo
            .trim();


    if (

        fundo

        &&

        !fundo.startsWith(
            "COLE_AQUI"
        )

    ) {


        document
            .getElementById(
                "backgroundLayer"
            )
            .style
            .backgroundImage =

                `url("${
                    urlComVersao(
                        fundo
                    )
                }")`;


    }


    else {


        document
            .getElementById(
                "backgroundLayer"
            )
            .style
            .backgroundImage = `

                radial-gradient(
                    circle at 25% 25%,
                    #173bb8,
                    transparent 35%
                ),

                radial-gradient(
                    circle at 70% 65%,
                    #641bb5,
                    transparent 38%
                ),

                linear-gradient(
                    135deg,
                    #061044,
                    #030825
                )

            `;


    }


}



/* =========================================================
   IMAGEM PADRÃO DO JOGADOR
========================================================= */


function imagemPadrao() {


    const svg = `

        <svg
            xmlns="http://www.w3.org/2000/svg"
            width="100"
            height="100"
        >

            <circle
                cx="50"
                cy="50"
                r="48"
                fill="#17255f"
            />


            <circle
                cx="50"
                cy="50"
                r="46"
                fill="none"
                stroke="#7181ff"
                stroke-width="2"
            />


            <text
                x="50"
                y="61"
                text-anchor="middle"
                font-family="Arial"
                font-size="38"
                fill="white"
            >

                ⚽

            </text>


        </svg>

    `;


    return (

        "data:image/svg+xml;charset=UTF-8,"

        +

        encodeURIComponent(
            svg
        )

    );


}



/* =========================================================
   TEXTO SEGURO
========================================================= */


function escapeHTML(texto) {


    return String(
        texto ?? ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );


}



/* =========================================================
   CRIAR CAIXA DO JOGADOR
========================================================= */


function criarCard(
    jogador,
    campeao = false
) {


    const nome =

        jogador.nome

        ||

        "A definir";


    const imagem =

        jogador.logo

        ?

        urlComVersao(
            jogador.logo
        )

        :

        imagemPadrao();


    return `

        <div
            class="
                player-card

                ${
                    campeao

                    ?

                    "champion-card"

                    :

                    ""
                }
            "
        >


            <img
                class="player-logo"

                src="${imagem}"

                alt=""

                referrerpolicy="no-referrer"

                onerror="
                    this.onerror=null;
                    this.src='${imagemPadrao()}';
                "
            >


            <span
                class="player-name"
            >

                ${escapeHTML(
                    nome
                )}

            </span>


        </div>

    `;


}
